# Traefik's basicAuth middleware reads an htpasswd file out of the `users`
# key, so what Vault holds is the finished `user:hash` line, not a plaintext
# password - external-secrets copies values through verbatim and has no way
# to hash one. Regenerate the Vault value with:
#   htpasswd -nbB <user> '<password>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-basic-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: longhorn-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: k3s-stage/longhorn
        property: basic_auth_users
