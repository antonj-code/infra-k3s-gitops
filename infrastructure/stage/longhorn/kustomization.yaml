apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately no `namespace:` transformer here - it would rewrite the
# HelmRelease pulled in from base out of flux-system, breaking its
# cross-namespace sourceRef. The resources below carry their own.
resources:
  - ../../base/longhorn/
  - vault-secrets
  - middlewares.yaml
  - ingress.yaml
