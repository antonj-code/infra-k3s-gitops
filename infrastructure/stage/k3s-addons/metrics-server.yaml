# A patch, not a manifest. k3s owns this Deployment - it is written from
# /var/lib/rancher/k3s/server/manifests on every server start - so Flux sets
# only the fields below via server-side apply and leaves the rest to k3s.
# k3s's manifest sets no affinity, so its re-apply leaves this field alone.
#
# prune: disabled, because Flux has this object in its inventory and would
# otherwise delete k3s's metrics-server if this file or the Kustomization
# were ever removed. Taking the patch out leaves the affinity behind; see
# docs/k3s-addons.md for removing it.
#
# Workers only, same selector as Traefik and the MetalLB L2Advertisement:
# k3s tolerates the control-plane taint for its add-ons, and this one landed
# on the first server because it was the only node when k3s started.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
