# k3s installs Traefik itself, from a bundled HelmChart in kube-system. A
# HelmChartConfig is the supported way to feed values into that chart without
# taking ownership of the install away from k3s - the deploy controller merges
# this into the chart's values and redeploys.
#
# Traefik fronts every Ingress hostname in the cluster, so every one of those
# names resolves to its address, and it must not be auto-assigned:
# an auto-assigned address is reallocated from primary-pool if the Service is
# ever recreated, which would silently break every name at once. Pinning it
# claims .26 out of reserved-pool.
#
# This is deliberately here and not in infra-k3s-bootstrap's k3s manifests
# directory: that repo stands the cluster up, Flux configures it. The cost is
# a transient address on a rebuild - k3s creates the Traefik Service before
# Flux exists, so MetalLB auto-assigns from primary-pool first and this
# annotation moves it to .26 afterwards, costing one redeploy mid-bootstrap.
# Accepted knowingly; .26 itself is never at risk, since reserved-pool has
# autoAssign off and nothing can take it in the meantime.
#
# For the same reason - every UI goes through it - Traefik runs two replicas
# on different nodes, with a disruption budget so a drain or k3s upgrade
# never takes both. Losing a node then costs a dropped endpoint rather than
# the ~5 minutes Kubernetes waits before rescheduling a lone pod. The address
# does not move and DNS is unaffected. See docs/traefik.md.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: "192.168.0.26"
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # DoNotSchedule rather than ScheduleAnyway: two replicas on one node is
    # the failure this exists to prevent, so a second pod that cannot be
    # placed elsewhere should stay Pending where it is visible.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-kube-system
