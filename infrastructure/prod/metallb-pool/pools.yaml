# Prod owns 192.168.0.32-.39.
#
# Both clusters advertise onto the same flat L2 segment - the VLANs (20 and
# 30) only separate their internal networks, not this one - so two MetalLB
# instances handing out the same address would both answer ARP for it. The
# ranges are split rather than shared for that reason, and must never
# overlap with stage's.
#
# Changing these ranges is not a pure GitOps operation. MetalLB's webhook
# rejects a pool overlapping an existing one, and Flux dry-runs every object
# in this path against live state before applying any of them - so a commit
# that shrinks one pool to make room for another is denied on the new pool
# and never gets far enough to apply the shrink, failing identically on
# every retry. Narrow or delete the live pool by hand first, then let Flux
# converge onto what is committed here.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: reserved-pool
  namespace: metallb-system
spec:
  # Addresses something outside the cluster points at by name - DNS records,
  # bookmarks, scrape configs. autoAssign is off so MetalLB never hands one
  # to a service that didn't ask for it explicitly; a service claims one with
  # the metallb.universe.tf/loadBalancerIPs annotation. Allocations:
  #   (none yet)
  autoAssign: false
  addresses:
  - 192.168.0.32-192.168.0.35
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary-pool
  namespace: metallb-system
spec:
  # Auto-assigned to anything that doesn't care what address it gets. Stays
  # outside the DHCP scope (192.168.0.50-.250) and below the static VIP
  # block at .40-.44.
  addresses:
  - 192.168.0.36-192.168.0.39
