# Prod owns 192.168.0.32-.39.
#
# Both clusters advertise onto the same flat L2 segment - the VLANs (20 and
# 30) only separate their internal networks, not this one - so two MetalLB
# instances handing out the same address would both answer ARP for it. The
# ranges are split rather than shared for that reason, and must never
# overlap with stage's.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: reserved-pool
  namespace: metallb-system
spec:
  # Addresses something outside the cluster points at by name - DNS records,
  # bookmarks, scrape configs. autoAssign is off so MetalLB never hands one
  # to a service that didn't ask for it explicitly; a service claims one with
  # the metallb.universe.tf/loadBalancerIPs annotation. Allocations:
  #   (none yet)
  autoAssign: false
  addresses:
  - 192.168.0.32-192.168.0.35
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary-pool
  namespace: metallb-system
spec:
  # Auto-assigned to anything that doesn't care what address it gets
  # (the Longhorn UI, for one). Stays outside the DHCP scope
  # (192.168.0.50-.250) and below the static VIP block at .40-.44.
  addresses:
  - 192.168.0.36-192.168.0.39
