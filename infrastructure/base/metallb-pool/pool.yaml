apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: reserved-pool
  namespace: metallb-system
spec:
  # Addresses that something outside the cluster points at by name - DNS
  # records, bookmarks, scrape configs. autoAssign is off so MetalLB never
  # hands one of these to a service that didn't ask for it explicitly;
  # a service claims one with the metallb.universe.tf/loadBalancerIPs
  # annotation. Current allocations:
  #   .24  grafana.jnet.lan
  autoAssign: false
  addresses:
  - 192.168.0.24-192.168.0.29
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary-pool
  namespace: metallb-system
spec:
  # Must stay outside the DHCP scope (192.168.0.50-192.168.0.250). k3s nodes
  # take dynamic leases from that scope on every repave, so any overlap lets
  # MetalLB hand a service an address a node already holds. This range sits
  # below the scope, beneath the static VIP block at .40-.44, and above the
  # reserved block that pinned services draw from.
  addresses:
  - 192.168.0.30-192.168.0.39
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: primary-l2
  namespace: metallb-system
spec:
  # Every pool that should be announced has to be named here. A pool left
  # off this list still gets addresses allocated - the service shows a
  # tidy EXTERNAL-IP and is silently unreachable, with nothing in its
  # events to say why.
  ipAddressPools:
  - reserved-pool
  - primary-pool
  nodeSelectors:
  - matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
    - key: node-role.kubernetes.io/master
      operator: DoesNotExist
