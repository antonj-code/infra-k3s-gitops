apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.6.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # The Longhorn 1.6 chart exposes only `type` and `nodePort` under
  # service.ui - there is no annotations field - so the MetalLB pin has to
  # be patched onto the rendered Service instead of passed as a value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: longhorn-frontend
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: longhorn-frontend
                annotations:
                  metallb.universe.tf/loadBalancerIPs: "192.168.0.25"
  values:
    service:
      ui:
        type: LoadBalancer
        externalTrafficPolicy: Local
    defaultSettings:
      # Worker nodes have a dedicated 50G disk mounted here; the OS /var
      # volume is only 5G and too small/full to host Longhorn replicas.
      defaultDataPath: /mnt/storage-data01
