apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.6.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    service:
      ui:
        # The UI is reached through Traefik, not directly - the per-cluster
        # overlay owns the Ingress and the basic-auth middleware in front of
        # it. Longhorn ships no authentication of its own, so this must never
        # go back to LoadBalancer without auth in front of it.
        type: ClusterIP
    defaultSettings:
      # Worker nodes have a dedicated 50G disk mounted here; the OS /var
      # volume is only 5G and too small/full to host Longhorn replicas.
      defaultDataPath: /mnt/storage-data01
