apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: security
  values:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    trivy:
      imageVulnerabilityScanning:
        enabled: false
    trivyOperator:
      vulnerabilityScannerEnabled: false
      configAuditScannerEnabled: true
    compliance:
      cron: 0 0 * * *
      specs:
      - k8s-cis-1.23
    nodeCollector:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      volumeMounts:
      - name: var-lib-rancher-k3s
        mountPath: /var/lib/rancher/k3s
        readOnly: true
      - name: etc-systemd
        mountPath: /etc/systemd
        readOnly: true
      volumes:
      - name: var-lib-rancher-k3s
        hostPath:
          path: /var/lib/rancher/k3s
      - name: etc-systemd
        hostPath:
          path: /etc/systemd
    excludeNamespaces: longhorn-system,kube-system
