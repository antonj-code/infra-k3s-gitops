apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
# The dashboard is kept as the plain JSON Grafana exports, so changing it is:
# edit in the UI, export, overwrite the file, commit. Grafana's sidecar loads
# any ConfigMap labelled grafana_dashboard: "1". The key becomes a file name in
# one shared directory, so it must be unique across all dashboards.
configMapGenerator:
  - name: grafana-dashboard-longhorn
    files:
      - longhorn.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
