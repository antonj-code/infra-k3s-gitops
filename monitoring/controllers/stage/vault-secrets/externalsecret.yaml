apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: k3s-stage/monitoring
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: k3s-stage/monitoring
        property: grafana_admin_password
---
# Traefik's basicAuth middleware reads an htpasswd file out of the `users`
# key, so what Vault holds is the finished `user:hash` line - see
# docs/monitoring-ui.md. Same Vault path as the Grafana credentials, so the
# existing k3s-stage-monitoring role and policy already cover it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: basic-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: k3s-stage/monitoring
        property: basic_auth_users
