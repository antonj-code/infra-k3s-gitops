apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ../../base/kube-prometheus-stack/
  - middlewares.yaml
  - ingress.yaml
patches:
  # Both UIs build absolute links from their own idea of where they live -
  # Grafana for redirects after login, Prometheus for alert generatorURLs -
  # so they have to be told the hostname Traefik serves them on.
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-prometheus-stack
      spec:
        values:
          grafana:
            grafana.ini:
              server:
                root_url: https://grafana.jnet.lan
          prometheus:
            prometheusSpec:
              externalUrl: https://prometheus.jnet.lan
  # k3s embeds etcd in the server process, so there are no component=etcd
  # pods for the chart's Service to select and the etcd dashboard stays
  # empty. List the control-plane nodes instead; k3s serves etcd metrics on
  # :2381 of each. Update this when a control-plane node's IP changes.
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-prometheus-stack
      spec:
        values:
          kubeEtcd:
            endpoints:
              - 10.20.20.11
              - 10.20.20.12
              - 10.20.20.13
