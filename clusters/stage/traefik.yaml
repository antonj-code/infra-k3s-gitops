apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/stage/traefik
  prune: true
  # The pinned address has to exist in a pool before Traefik's Service can
  # claim it, and reserved-pool is created by metallb-pool.
  dependsOn:
    - name: metallb-pool
  sourceRef:
    kind: GitRepository
    name: flux-system
