apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/stage/
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
    - name: vault-auth-delegator
