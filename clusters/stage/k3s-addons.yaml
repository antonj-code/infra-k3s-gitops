apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k3s-addons
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/stage/k3s-addons
  # Everything in this path patches an object k3s owns, and each one opts
  # out of pruning with its own annotation - Flux must never delete a k3s
  # add-on. prune stays on so anything Flux-owned added here later is
  # cleaned up as usual.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
